name: Weekly icon4py review

on:
  schedule:
    # Sunday 21:00 UTC
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: weekly-review
  cancel-in-progress: false

env:
  TZ: Europe/Zurich

jobs:
  review:
    environment: weekly-review
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - name: Checkout icon4py
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19'

      - name: Install pi
        run: npm install -g @earendil-works/pi-coding-agent@1.5.2

      - name: Install search tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep fd-find
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd

      - name: Install AWF
        id: awf-setup
        uses: github/gh-aw-firewall@7dc485464a58130d6ac2e73fe632424eb5d06823
        with:
          version: v0.29.12
          pull-images: "true"

      - name: Run review
        env:
          CSCS_INFERENCE_API_KEY: ${{ secrets.CSCS_INFERENCE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.CSCS_INFERENCE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_SEVERITY: high
          REVIEW_PANEL_SIZE: 3
          REVIEW_BASE_URL: "https://api.inference.cscs.ch/v1"
          REVIEW_MODEL_ID: "zai-org/GLM-5.3"
        run: |
          ./scripts/run weekly-review run \
            --checkout "${{ github.workspace }}" \
            --repo "${{ github.repository }}" \
            --severity "${REVIEW_SEVERITY}" \
            --panel-size "${REVIEW_PANEL_SIZE}" \
            --reviewer architecture \
            --reviewer correctness \
            --reviewer performance \
            --model-id "${REVIEW_MODEL_ID}" \
            --model-base-url "${REVIEW_BASE_URL}" \
            --artifacts-dir "${{ github.workspace }}/review-artifacts" \
            --publish

      - name: Report to the job summary
        if: always()
        run: |
          if [[ ! -d review-artifacts ]]; then
            echo "No overview report was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          report="$(find review-artifacts -type f -path '*/reports/*.md' -print -quit || true)"
          if [[ -n "$report" ]]; then
            echo "# Weekly review report" >> "$GITHUB_STEP_SUMMARY"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No overview report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-review-${{ github.run_id }}
          path: review-artifacts/
          if-no-files-found: warn
